syntax = "proto3";

package habit.v1;

import "google/protobuf/timestamp.proto";

message RoutineItem {
  int64 id = 1;
  int64 routine_id = 2;
  int64 exercise_id = 3;
  int32 position = 4;
}

message Routine {
  int64 id = 1;
  string name = 2;
  google.protobuf.Timestamp created_at = 3;
  optional google.protobuf.Timestamp archived_at = 4;
  repeated RoutineItem items = 5;
  // When true, the runner walks one set at a time round-robin across items
  // (circuit / superset style). When false, each item is fully exhausted
  // before moving to the next.
  bool alternate_sets = 6;
}

message ListRoutinesRequest {
  bool include_archived = 1;
}
message ListRoutinesResponse {
  repeated Routine routines = 1;
}

message GetRoutineRequest { int64 id = 1; }
message GetRoutineResponse { Routine routine = 1; }

message CreateRoutineRequest {
  string name = 1;
  // Ordered list of exercise IDs that compose the routine.
  repeated int64 exercise_ids = 2;
  bool alternate_sets = 3;
}
message CreateRoutineResponse { Routine routine = 1; }

message UpdateRoutineRequest {
  int64 id = 1;
  string name = 2;
  // If non-empty, replaces the routine items in the given order.
  repeated int64 exercise_ids = 3;
  bool alternate_sets = 4;
}
message UpdateRoutineResponse { Routine routine = 1; }

message ArchiveRoutineRequest { int64 id = 1; }
message ArchiveRoutineResponse {}

message RoutineRun {
  int64 id = 1;
  int64 routine_id = 2;
  google.protobuf.Timestamp started_at = 3;
  optional google.protobuf.Timestamp ended_at = 4;
}

message StartRoutineRequest { int64 routine_id = 1; }
message StartRoutineResponse { RoutineRun run = 1; }

message EndRoutineRunRequest { int64 run_id = 1; }
message EndRoutineRunResponse { RoutineRun run = 1; }
