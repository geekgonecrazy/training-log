syntax = "proto3";

package habit.v1;

import "google/protobuf/timestamp.proto";
import "habit/v1/common.proto";

message Session {
  int64 id = 1;
  int64 exercise_id = 2;
  optional int64 routine_run_id = 3;
  google.protobuf.Timestamp started_at = 4;
  optional google.protobuf.Timestamp ended_at = 5;
  SessionStatus status = 6;
  optional int32 count_completed = 7;
  optional int32 count_goal = 8;
  optional int32 duration_seconds = 9;
  optional Difficulty difficulty = 10;
  string notes = 11;
  string client_id = 12;
  // 1-based set index for multi-set workouts; NULL/0 for logged-only kinds.
  optional int32 set_index = 13;
  // Planned set total at the time of logging (so reports can recover the plan).
  optional int32 set_total = 14;
  // Actual weight used (pounds) for weighted sessions.
  optional double weight_lb = 15;
}

message LogSessionRequest {
  // Idempotency key from frontend. Required.
  string client_id = 1;
  int64 exercise_id = 2;
  optional int64 routine_run_id = 3;
  google.protobuf.Timestamp started_at = 4;
  google.protobuf.Timestamp ended_at = 5;
  SessionStatus status = 6;
  optional int32 count_completed = 7;
  optional int32 count_goal = 8;
  optional int32 duration_seconds = 9;
  optional Difficulty difficulty = 10;
  string notes = 11;
  optional int32 set_index = 12;
  optional int32 set_total = 13;
  optional double weight_lb = 14;
}
message LogSessionResponse { Session session = 1; }

message ListSessionsRequest {
  optional google.protobuf.Timestamp from = 1;
  optional google.protobuf.Timestamp to = 2;
  optional int64 exercise_id = 3;
  optional int64 routine_run_id = 4;
  int32 limit = 5;
}
message ListSessionsResponse {
  repeated Session sessions = 1;
}
